<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="manifest" href="manifest.json">
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArGlasses Control Hub</title>
    <style>
        :root { --bg: #09090b; --card: #18181b; --text: #e4e4e7; --accent: #8b5cf6; --green: #10b981; }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 15px; margin: 0; max-width: 500px; margin: 0 auto; }
        h1 { font-size: 1.5rem; text-align: center; color: var(--accent); margin-bottom: 20px; }
        .card { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #27272a; }
        .title { font-size: 0.9rem; font-weight: bold; color: #a1a1aa; margin-bottom: 10px; text-transform: uppercase; }
        input[type="text"], input[type="password"] { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #3f3f46; background: #000; color: white; margin-bottom: 10px; box-sizing: border-box;}
        button { width: 100%; padding: 12px; border-radius: 8px; border: none; background: var(--accent); color: white; font-weight: bold; font-size: 1rem; cursor: pointer; margin-bottom: 8px; }
        button:active { opacity: 0.8; }
        .btn-green { background: var(--green); }
        .btn-dark { background: #3f3f46; }
        .log { background: #000; padding: 10px; font-family: monospace; font-size: 0.8rem; height: 100px; overflow-y: auto; border-radius: 8px; color: #10b981; }
        #cameraPreview { width: 100%; border-radius: 8px; display: none; margin-bottom: 10px; border: 2px solid var(--accent); }
    </style>
</head>
<body>

    <h1>👓 ArGlasses Hub</h1>

    <div class="card">
        <div class="title">1. Связь & Настройки</div>
        <input type="password" id="apiKey" placeholder="Gemini API Key">
        <button id="connectBtn" onclick="connectBLE()">📡 Подключить ArGlasses</button>
    </div>

    <div class="card">
        <div class="title">📷 Умное зрение (AI)</div>
        <p style="font-size: 0.8rem; color: #a1a1aa;">Нажми кнопку на очках, чтобы сделать фото.</p>
        <img id="cameraPreview" alt="Снимок с очков">
        <div id="aiResponse" style="color: var(--accent); font-weight: bold; min-height: 20px;">Ожидание фото...</div>
    </div>

    <div class="card">
        <div class="title">📝 Шпаргалка / Прямой текст</div>
        <input type="text" id="cheatText" placeholder="Введи текст для экрана очков" maxlength="40">
        <button class="btn-dark" onclick="sendCustomText()">Отправить на очки</button>
    </div>

    <div class="card">
        <div class="title">🎙 Шпионский диктофон</div>
        <button class="btn-green" id="micBtn" onclick="startDictation()">Начать прослушивание</button>
    </div>

    <div class="card">
        <div class="title">⌚ Инструменты</div>
        <button class="btn-dark" onclick="sendTime()">Отправить текущее время</button>
    </div>

    <div class="card">
        <div class="title">Лог системы</div>
        <div class="log" id="logBox">Система загружена...</div>
    </div>

    <script>
        const SERVICE_UUID = '4fae8f08-58a2-476e-b14c-c92d516bad59';
        const CHAR_IMAGE = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';
        const CHAR_TEXT = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';

        let textChar = null;
        let imageBuffer = [];
        let receivingImage = false;

        function log(msg) {
            const lb = document.getElementById('logBox');
            lb.innerText += `\n> ${msg}`;
            lb.scrollTop = lb.scrollHeight;
        }

        async function connectBLE() {
            try {
                log("Ищем ArGlasses...");
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'ArGlasses' }],
                    optionalServices: [SERVICE_UUID]
                });
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                
                const imgChar = await service.getCharacteristic(CHAR_IMAGE);
                await imgChar.startNotifications();
                imgChar.addEventListener('characteristicvaluechanged', handleImageChunk);

                textChar = await service.getCharacteristic(CHAR_TEXT);
                
                document.getElementById('connectBtn').innerText = "✅ Очки Подключены";
                document.getElementById('connectBtn').style.background = "var(--green)";
                log("Успешное подключение!");
            } catch (e) { log("Ошибка BLE: " + e); }
        }

        function handleImageChunk(event) {
            const chunk = new Uint8Array(event.target.value.buffer);
            
            // Если находим начало JPEG (FF D8)
            if (chunk.length >= 2 && chunk[0] === 0xFF && chunk[1] === 0xD8) {
                imageBuffer = [];
                receivingImage = true;
                log("Начат прием фото...");
                document.getElementById('aiResponse').innerText = "Загрузка фото по BLE...";
            }

            if (receivingImage) {
                for (let i = 0; i < chunk.length; i++) imageBuffer.push(chunk[i]);
            }

            // Если находим конец JPEG (FF D9)
            if (receivingImage && chunk.length >= 2 && chunk[chunk.length - 2] === 0xFF && chunk[chunk.length - 1] === 0xD9) {
                receivingImage = false;
                log(`Фото получено! Размер: ${imageBuffer.length} байт`);
                
                const binary = String.fromCharCode.apply(null, new Uint8Array(imageBuffer));
                const base64 = btoa(binary);
                
                document.getElementById('cameraPreview').src = 'data:image/jpeg;base64,' + base64;
                document.getElementById('cameraPreview').style.display = 'block';
                
                processImageToGemini(base64);
            }
        }

        async function processImageToGemini(base64Data) {
            const key = document.getElementById('apiKey').value;
            if(!key) { log("Введи API ключ!"); return; }
            
            log("Отправка в Gemini...");
            document.getElementById('aiResponse').innerText = "Анализ нейросетью...";

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${key}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [
                            { text: "Кратко и понятно опиши что на фото. Ответ до 5 слов." },
                            { inlineData: { mimeType: "image/jpeg", data: base64Data } }
                        ]}]
                    })
                });
                const data = await res.json();
                const text = data.candidates[0].content.parts[0].text.trim();
                
                document.getElementById('aiResponse').innerText = text;
                log("Gemini: " + text);
                sendTextToGlasses(text);
            } catch (e) {
                log("Ошибка Gemini: " + e);
            }
        }

        async function sendTextToGlasses(text) {
            if (!textChar) { log("Очки не подключены!"); return; }
            try {
                // Обрезаем до 60 символов, чтобы не перегрузить дисплей 0.49"
                const safeText = text.substring(0, 60); 
                const encoder = new TextEncoder();
                await textChar.writeValue(encoder.encode(safeText));
                log("-> Текст на дисплее!");
            } catch (e) { log("Ошибка отправки: " + e); }
        }

        function sendCustomText() {
            const txt = document.getElementById('cheatText').value;
            if(txt) sendTextToGlasses(txt);
        }

        function sendTime() {
            const now = new Date();
            const timeStr = `Time:\n${now.getHours()}:${now.getMinutes().toString().padStart(2, '0')}`;
            sendTextToGlasses(timeStr);
        }

        function startDictation() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) { log("Браузер не поддерживает диктофон"); return; }
            
            const btn = document.getElementById('micBtn');
            const recognition = new SpeechRecognition();
            recognition.lang = 'ru-RU';
            recognition.interimResults = false;
            
            recognition.onstart = () => { btn.innerText = "Слушаю..."; btn.style.background = "#ef4444"; log("Микрофон включен"); };
            recognition.onresult = (e) => {
                const text = e.results[0][0].transcript;
                log("Услышано: " + text);
                sendTextToGlasses(text);
            };
            recognition.onend = () => { btn.innerText = "Начать прослушивание"; btn.style.background = "var(--green)"; };
            recognition.start();
        }
    </script>
</body>
</html>
